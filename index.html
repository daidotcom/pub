<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>NEWS FLOW</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}.app{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 26px) 22px calc(env(safe-area-inset-bottom) + 24px)}header{display:flex;justify-content:space-between;align-items:center;font-size:15px;letter-spacing:2px;font-weight:800}#status{font-size:12px;letter-spacing:0;color:#9fb5d5}main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:25px}#category{color:#67e8f9;font-size:17px}#headline{font-size:clamp(30px,8vw,58px);line-height:1.48;font-weight:800;overflow-wrap:anywhere}#date{font-size:13px;color:#a7b5cc}#bar{height:4px;background:#334155;border-radius:5px;overflow:hidden}#progress{height:100%;width:0;background:#67e8f9}footer{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select{background:#222e44;color:white;border:1px solid #53627b;border-radius:10px;padding:12px;font-size:15px}#message{color:#9fb0ca;font-size:12px;line-height:1.5;margin-top:15px}a{color:inherit;text-decoration:none}</style></head><body><div class="app"><header><span>● NEWS FLOW</span><span id="status">準備中</span></header><main><div id="category">日本語ニュース</div><a id="link" href="#" target="_blank" rel="noopener"><div id="headline">ニュースを読み込んでいます…</div></a><div id="date"></div><div id="bar"><div id="progress"></div></div></main><footer><button id="prev">前へ</button><button id="toggle">一時停止</button><button id="next">次へ</button><label>間隔 <select id="speed"><option value="5000">5秒</option><option value="10000" selected>10秒</option><option value="15000">15秒</option><option value="20000">20秒</option></select></label><button id="refresh">更新</button></footer><div id="message">ニュースデータはGitHub側で定期取得します。</div></div><script>let items=[],idx=0,paused=false,elapsed=0,last=Date.now(),duration=10000;const $=id=>document.getElementById(id);function show(){if(!items.length)return;const x=items[idx];$('category').textContent=x.category||'ニュース';$('headline').textContent=x.title;$('date').textContent=x.published||'';$('link').href=x.link||'#';$('status').textContent=(idx+1)+' / '+items.length;elapsed=0;$('progress').style.width='0%'}async function load(){ $('status').textContent='更新中';try{const r=await fetch('news.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.items)||!d.items.length)throw Error('記事データが空です');items=d.items;idx=0;show();$('message').textContent='最終取得: '+(d.updated||'不明')+' ／ タイトルをタップすると記事を開きます。';}catch(e){$('status').textContent='取得エラー';$('headline').textContent='ニュースを取得できません';$('message').textContent='GitHub Actionsがまだ実行されていない可能性があります。詳細: '+e.message;}}function next(n){if(!items.length)return;idx=(idx+n+items.length)%items.length;show()}$('prev').onclick=()=>next(-1);$('next').onclick=()=>next(1);$('toggle').onclick=()=>{paused=!paused;$('toggle').textContent=paused?'再開':'一時停止'};$('speed').onchange=e=>{duration=Number(e.target.value);elapsed=0};$('refresh').onclick=load;setInterval(()=>{const now=Date.now(),delta=Math.min(now-last,1000);last=now;if(paused||!items.length)return;elapsed+=delta;$('progress').style.width=Math.min(100,elapsed/duration*100)+'%';if(elapsed>=duration)next(1)},200);setInterval(load,10*60*1000);load();</script></body></html>
